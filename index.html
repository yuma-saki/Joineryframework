<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>芯組みシミュレーター Ver.1.3</title>
    <link rel="stylesheet" href="shingumi.css">
</head>
<body>

<h1>芯組みシミュレーター Ver.1.3</h1>

<div class="container">
    <div class="panel">
        <h2>1. カット寸法設定 (mm)</h2>
        <div class="input-group">
            <label>カット 高さ (H)</label>
            <input type="number" id="h" value="2000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>カット 幅 (W)</label>
            <input type="number" id="w" value="900" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>仕上 厚み (D)</label>
            <input type="number" id="d" value="30" oninput="calculate()">
        </div>

        <h2>2. 芯材設定 (mm)</h2>
        <div class="input-group">
            <label>建具種別</label>
            <select id="typeSelect" onchange="onTypeChange()">
                <option value="建具">建具</option>
                <option value="家具">家具</option>
            </select>
        </div>
        <div class="input-group">
            <label id="lvlLabel">縦桟/上下桟 幅 (LVL)</label>
            <input type="number" id="lvlWidth" value="35" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>中桟（貫） 幅</label>
            <input type="number" id="nukiWidth" value="24" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>中桟本数</label>
            <input type="number" id="nukiCount" value="5" min="0" oninput="calculate()">
        </div>
        <div class="input-group">
            <label id="boardLenLabel">LVL 定尺長さ</label>
            <input type="number" id="boardLen" value="2120" oninput="calculate()">
        </div>

        <h2>3. 補強オプション</h2>
        <div class="input-group">
            <input type="checkbox" id="optHikite" checked onchange="calculate()">
            <label style="display:inline">引手補強 (左右各2本/H900芯)</label>
        </div>
    </div>

    <div class="panel">
        <div class="info-box" id="calcSummary"></div>

        <div id="canvas-container">
            <canvas id="doorCanvas"></canvas>
        </div>

        <h2>木取りリスト (芯材製作寸法)</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th>部材名</th>
                    <th>寸法 (長さ)</th>
                    <th>本数</th>
                    <th>備考</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>

        <h2 id="procurementTitle">材料手配リスト (LVL 2120mm)</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th>部材名</th>
                    <th>パーツ長さ</th>
                    <th>1本取り数</th>
                    <th>必要本数</th>
                </tr>
            </thead>
            <tbody id="procurementBody"></tbody>
        </table>
    </div>
</div>

<script src="shingumi.js"></script>
</body>
</html>
