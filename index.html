<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芯組みシミュレーター Ver.1.3</title>
    <link rel="stylesheet" href="shingumi.css">
</head>
<body>

<header class="app-header">
    <h1>芯組みシミュレーター</h1>
    <span class="version">Ver.1.3</span>
</header>

<main class="tab-content">
    <!-- タブ1: 入力 -->
    <section id="tab-input" class="tab-panel active">
        <div class="panel">
            <h2>建具種別</h2>
            <div class="input-group">
                <select id="typeSelect" onchange="onTypeChange()">
                    <option value="建具">建具</option>
                    <option value="家具">家具</option>
                </select>
            </div>

            <h2>カット寸法 (mm)</h2>
            <div class="input-row input-row-3">
                <div class="input-group">
                    <label>高さ (H)</label>
                    <input type="number" inputmode="decimal" id="h" value="2000" oninput="updateDefaultNukiCount(); calculate()">
                </div>
                <div class="input-group">
                    <label>幅 (W)</label>
                    <input type="number" inputmode="decimal" id="w" value="900" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>枚数</label>
                    <input type="number" inputmode="numeric" id="qty" value="1" min="1" oninput="calculate()">
                </div>
            </div>

            <h2>補強オプション</h2>
            <div class="input-group checkbox-group">
                <input type="checkbox" id="optHikite" checked onchange="calculate()">
                <label id="optHikiteLabel" for="optHikite">引手補強 (左右各2本/H900芯)</label>
            </div>
            <div class="input-group checkbox-group" id="tsurido-option">
                <input type="checkbox" id="optTsurido" onchange="calculate()">
                <label for="optTsurido">吊り戸車補強 (下桟 横勝ち)</label>
            </div>
        </div>

        <button class="cta-button" onclick="switchTab('result')">
            結果を見る
            <span class="cta-arrow">→</span>
        </button>
    </section>

    <!-- タブ2: 結果・プレビュー -->
    <section id="tab-result" class="tab-panel">
        <div class="panel">
            <div class="info-box" id="calcSummary"></div>

            <div id="canvas-container">
                <canvas id="doorCanvas"></canvas>
            </div>

            <h2>木取りリスト (芯材製作寸法)</h2>
            <div class="table-wrapper">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>部材名</th>
                            <th>寸法</th>
                            <th>本数</th>
                            <th>備考</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>

            <div class="procurement-card" id="procurementCard">
                <button class="procurement-summary" onclick="toggleProcurement('procurementCard')">
                    <div class="procurement-summary-left">
                        <span class="procurement-label" id="procurementTitle">材料手配リスト — LVL</span>
                        <span class="procurement-total" id="procurementTotal">— 本</span>
                    </div>
                    <span class="toggle-icon">▼</span>
                </button>
                <div class="procurement-detail" id="procurementDetail">
                    <div class="table-wrapper">
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th style="width:2em">No.</th>
                                    <th>カット内容</th>
                                    <th style="white-space:nowrap">残り</th>
                                </tr>
                            </thead>
                            <tbody id="procurementBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="procurement-card" id="nukiProcurementCard">
                <button class="procurement-summary" onclick="toggleProcurement('nukiProcurementCard')">
                    <div class="procurement-summary-left">
                        <span class="procurement-label" id="nukiProcurementTitle">材料手配リスト — 中桟材</span>
                        <span class="procurement-total" id="nukiProcurementTotal">— 本</span>
                    </div>
                    <span class="toggle-icon">▼</span>
                </button>
                <div class="procurement-detail" id="nukiProcurementDetail">
                    <div class="table-wrapper">
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th style="width:2em">No.</th>
                                    <th>カット内容</th>
                                    <th style="white-space:nowrap">残り</th>
                                </tr>
                            </thead>
                            <tbody id="nukiProcurementBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- タブ3: 芯材設定 -->
    <section id="tab-config" class="tab-panel">
        <div class="panel">
            <h2>芯材寸法 (mm)</h2>
            <div class="input-row input-row-2">
                <div class="input-group">
                    <label id="lvlLabel">縦桟/上下桟 幅 (LVL)</label>
                    <input type="number" inputmode="decimal" id="lvlWidth" value="35" oninput="updateDefaultNukiCount(); calculate()">
                </div>
                <div class="input-group">
                    <label>中桟 幅</label>
                    <input type="number" inputmode="decimal" id="nukiWidth" value="24" oninput="calculate()">
                </div>
            </div>
            <div class="input-group">
                <label>中桟本数</label>
                <input type="number" inputmode="numeric" id="nukiCount" value="5" min="0" oninput="calculate()">
            </div>

            <h2>定尺長さ (mm)</h2>
            <div class="input-row input-row-2">
                <div class="input-group">
                    <label id="boardLenLabel">LVL 定尺</label>
                    <input type="number" inputmode="decimal" id="boardLen" value="2120" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>中桟材 定尺</label>
                    <input type="number" inputmode="decimal" id="nukiBoardLen" value="900" oninput="calculate()">
                </div>
            </div>
        </div>
    </section>
</main>

<!-- ボトムナビゲーション -->
<nav class="bottom-nav">
    <button class="nav-item active" id="nav-input" onclick="switchTab('input')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="12" y2="17"/>
        </svg>
        <span>入力</span>
    </button>
    <button class="nav-item" id="nav-result" onclick="switchTab('result')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <polyline points="8,12 11,15 16,9"/>
        </svg>
        <span>結果</span>
    </button>
    <button class="nav-item" id="nav-config" onclick="switchTab('config')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>設定</span>
    </button>
</nav>

<script src="shingumi.js"></script>
</body>
</html>
